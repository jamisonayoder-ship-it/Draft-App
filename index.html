<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3EE; --card:#FFFFFF; --ink:#14201B; --muted:#5D6B64;
  --line:#DCE2DB; --line2:#EDF0EA;
  --flag:#F2B705; --flag-dim:#FDF3D2;
  --deep:#123F5E; --deep-soft:#E4EDF3;
  --good:#1B7F5A; --warn:#C77B12; --bad:#B23A2E;
  --qb:#7A3E9D; --rb:#1B7F5A; --wr:#2563A8; --te:#C2701C; --k:#6B7280; --dst:#4B5563; --dp:#8A5A2B;
  --qb-s:#F4EAFA; --rb-s:#E3F4ED; --wr-s:#E5F0FB; --te-s:#FCF0E1; --k-s:#EFF1F3; --dst-s:#EEF0F2; --dp-s:#F7EDE2;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.01em}
.eyebrow{font-family:"Oswald",sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--muted)}

/* ---------- shell ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);padding-top:10px}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Oswald",sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.brand span{color:var(--flag)}
.leaguetabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.ltab{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500}
.ltab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn.warn:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- signature: pick ribbon ---------- */
.ribbon{display:flex;align-items:stretch;gap:14px;padding:12px 0 12px;overflow:hidden}
.clock{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding-right:16px;border-right:2px solid var(--ink)}
.clocknum{font-family:"Oswald",sans-serif;font-weight:700;font-size:52px;line-height:.85;letter-spacing:-.02em}
.clocknum.now{color:var(--flag)}
.clocklab{max-width:112px}
.clocklab .l1{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);line-height:1.3}
.flow{flex:1;display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fp{flex:0 0 auto;min-width:56px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 6px;text-align:center}
.fp .n{font-size:10px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.fp .t{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
.fp.mine{background:var(--flag);border-color:#D9A404}
.fp.mine .n{color:#6b5300}
.fp.done{opacity:.4}
.fp.oc{outline:2px solid var(--ink);outline-offset:-2px}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:1fr 372px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card.acc-blue>h3{box-shadow:inset 0 3px 0 var(--deep)}
.card.acc-gold>h3{box-shadow:inset 0 3px 0 var(--flag)}
.card.acc-green>h3{box-shadow:inset 0 3px 0 var(--rb)}
.card.acc-plum>h3{box-shadow:inset 0 3px 0 var(--qb)}
.card.acc-slate>h3{box-shadow:inset 0 3px 0 var(--dst)}
.card>h3{margin:0;padding:13px 14px 11px;border-bottom:1px solid var(--line2);font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:12px;display:flex;align-items:center;gap:8px}
.card>h3 .sub{margin-left:auto;font-family:"IBM Plex Sans";text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;color:var(--muted)}

/* ---------- controls ---------- */
.controls{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line2)}
input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:2px solid var(--deep);outline-offset:0;border-color:var(--deep)}
#search{flex:1;min-width:150px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on[data-p=QB]{background:var(--qb);border-color:var(--qb)}
.chip.on[data-p=RB]{background:var(--rb);border-color:var(--rb)}
.chip.on[data-p=WR]{background:var(--wr);border-color:var(--wr)}
.chip.on[data-p=TE]{background:var(--te);border-color:var(--te)}
.chip.on[data-p=K]{background:var(--k);border-color:var(--k)}
.chip.on[data-p=DST]{background:var(--dst);border-color:var(--dst)}
.chip.on[data-p=DP]{background:var(--dp);border-color:var(--dp)}

/* ---------- player rows ---------- */
.rows{max-height:64vh;overflow-y:auto}
.row{display:grid;grid-template-columns:34px 1fr 62px 54px 46px 30px;gap:9px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2)}
.row{border-left:3px solid transparent}
.row.p-QB{border-left-color:var(--qb)} .row.p-RB{border-left-color:var(--rb)}
.row.p-WR{border-left-color:var(--wr)} .row.p-TE{border-left-color:var(--te)}
.row.p-K{border-left-color:var(--k)}   .row.p-DST{border-left-color:var(--dst)}
.row.p-DP{border-left-color:var(--dp)}
.row.p-QB:hover{background:var(--qb-s)} .row.p-RB:hover{background:var(--rb-s)}
.row.p-WR:hover{background:var(--wr-s)} .row.p-TE:hover{background:var(--te-s)}
.row.p-K:hover{background:var(--k-s)}   .row.p-DST:hover{background:var(--dst-s)}
.row.p-DP:hover{background:var(--dp-s)}
.row .rk{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.nm{font-weight:600;line-height:1.2;cursor:pointer}
.nm:hover{text-decoration:underline}
.meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pos{font-family:"Oswald",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.06em;padding:1px 5px;border-radius:4px;color:#fff}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}
.pos.TE{background:var(--te)}.pos.K{background:var(--k)}.pos.DST{background:var(--dst)}.pos.DP{background:var(--dp)}
.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.surv{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.take{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:26px;font-size:15px;line-height:1;padding:0}
.take:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.assign{border:none;background:none;color:var(--muted);font-size:11px;padding:0 2px}
.assign:hover{color:var(--ink);text-decoration:underline}
.cliff{border-bottom:2px solid var(--flag)}

/* ---------- recs ---------- */
.rec{padding:11px 13px;border-bottom:1px solid var(--line2)}
.rec:last-child{border-bottom:none}
.rec.top{background:linear-gradient(180deg,var(--flag-dim),#fff)}
.rec.p-QB{border-left:4px solid var(--qb)} .rec.p-RB{border-left:4px solid var(--rb)}
.rec.p-WR{border-left:4px solid var(--wr)} .rec.p-TE{border-left:4px solid var(--te)}
.rec.p-K{border-left:4px solid var(--k)}   .rec.p-DST{border-left:4px solid var(--dst)}
.rec.p-DP{border-left:4px solid var(--dp)}
.rechead{display:flex;align-items:baseline;gap:8px}
.recrank{font-family:"Oswald",sans-serif;font-weight:700;font-size:15px;color:var(--muted);min-width:16px}
.recname{font-family:"Oswald",sans-serif;font-weight:600;font-size:17px;letter-spacing:.01em}
.recwhy{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.bars{margin-top:6px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.bars i{display:block;height:100%;background:var(--deep)}
.recbtn{margin-top:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:600}
.recbtn:hover{background:#000}

/* ---------- roster ---------- */
.slotline{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:5px 13px;border-bottom:1px solid var(--line2);align-items:center;font-size:12.5px}
.slotline .sl{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.empty{color:#A9B4AC;font-style:italic}
.byewarn{color:var(--bad);font-size:11px;font-weight:600}

/* ---------- setup ---------- */
.setup{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
label.f{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:500}
.f input,.f select{width:100%}
fieldset{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:0 0 12px}
legend{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);padding:0 6px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.slotpick{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:4px 7px;background:#fff}
.slotpick.mine{border-color:var(--flag);background:var(--flag-dim)}
.slotpick .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);width:18px}
.slotpick input[type=text]{border:none;padding:2px 0;flex:1;min-width:0;background:transparent}
.slotpick input[type=text]:focus{outline:none;border-bottom:1px solid var(--deep)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:8px 16px;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:"IBM Plex Mono",monospace;font-size:12px}

/* ---------- pick ownership grid ---------- */
.pickgrid{display:flex;flex-direction:column;gap:3px;max-height:300px;overflow:auto;padding:3px;border:1px solid var(--line2);border-radius:8px;background:#FBFCFA}
.pgrow{display:flex;gap:3px;align-items:center}
.pgr{font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.06em;color:var(--muted);flex:0 0 28px}
.pgc{flex:0 0 auto;width:25px;height:22px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:10.5px;padding:0;color:#9AA69F;font-family:"IBM Plex Mono",monospace}
.pgc:hover{border-color:var(--ink);color:var(--ink)}
.pgc.on{background:var(--flag);border-color:#C79A04;color:#5B4600;font-weight:700}
.pgc.gone{opacity:.35}

/* ---------- room watch ---------- */
.rw{width:100%;border-collapse:collapse;font-size:12.5px}
.rw th{text-align:left;font-family:"Oswald",sans-serif;font-weight:500;text-transform:uppercase;
  letter-spacing:.09em;font-size:10px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rw td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.rw tr.soon{background:linear-gradient(90deg,var(--flag-dim),transparent)}
.rw .who{font-weight:600}
.rw .pk{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11.5px}
.shape{display:flex;gap:3px;flex-wrap:wrap}
.shape span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:1px 5px;border-radius:4px;color:#fff}
.tgt{display:flex;gap:6px;align-items:baseline;line-height:1.4;margin-bottom:2px}
.tgt .r{font-size:11px;color:var(--muted)}
@media (max-width:700px){.rw .hidesm{display:none}}

/* ---------- misc ---------- */
.log{max-height:220px;overflow-y:auto;font-size:12px}
.logrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:4px 13px;border-bottom:1px solid var(--line2)}
.logrow .p{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tag.hot{border-color:var(--flag);background:var(--flag-dim);color:#7a5f00}
.tag.hurt{border-color:var(--bad);background:#FBEAE7;color:var(--bad);font-weight:600}
.footer{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:560px;width:92%}
dialog::backdrop{background:rgba(20,32,27,.35)}
.dlg{padding:16px}
.dlg h4{margin:0 0 10px;font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:13px}
@media (prefers-reduced-motion:no-preference){.fp,.row{transition:background .12s ease}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brandrow">
    <h1 class="brand">Draft<span>.</span>Room</h1>
    <div class="leaguetabs" id="leaguetabs"></div>
    <button class="iconbtn" id="btnSetup">Settings</button>
    <button class="iconbtn" id="btnUndo">Undo pick</button>
    <button class="iconbtn" id="btnData">Data</button>
  </div>
  <div class="ribbon" id="ribbon"></div>
</header>

<!-- SETUP -->
<section id="setupView" class="card hidden" style="margin-top:16px">
  <h3>League setup <span class="sub" id="setupName"></span></h3>
  <div class="setup" id="setupBody"></div>
</section>

<!-- DRAFT -->
<div class="cols" id="draftView">
  <div>
    <div class="card acc-blue">
      <h3>Board <span class="sub" id="boardSub"></span></h3>
      <div class="controls">
        <input type="text" id="search" placeholder="Search a player, then tap → to log the pick">
        <div class="chips" id="posChips"></div>
        <label style="font-size:12px;display:flex;align-items:center;gap:5px;color:var(--muted)">
          <input type="checkbox" id="showDrafted"> show drafted
        </label>
      </div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="card acc-slate" style="margin-top:16px">
      <h3>Pick log <span class="sub" id="logSub"></span></h3>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div>
    <div class="card acc-gold">
      <h3 id="recHead">Best available</h3>
      <div id="recs"></div>
    </div>
    <div class="card acc-green" style="margin-top:16px">
      <h3>My roster <span class="sub" id="rosterSub"></span></h3>
      <div id="roster"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Run on positions <span class="sub">last 12 picks</span></h3>
      <div id="runs" style="padding:11px 13px"></div>
    </div>
  </div>
</div>

<div class="card acc-plum" id="roomCard" style="margin-top:16px">
  <h3>Room watch <span class="sub" id="roomSub">what the rest of the league is likely to take, and why</span></h3>
  <div style="overflow-x:auto"><table class="rw"><thead><tr>
    <th>Team</th><th>Next pick</th><th class="hidesm">Roster so far</th><th>Likely targets</th>
  </tr></thead><tbody id="roomBody"></tbody></table></div>
</div>

<p class="footer" id="footer"></p>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>

/* ============================================================

function parsePool(raw){
  const num = v => (v===undefined || v==="" ) ? null : (parseFloat(v));
  return raw.trim().split("\n").map((line,i)=>{
    const c = line.split("|");
    const team = (c[2]||"").trim();
    return {id:i, name:c[0].trim(), pos:c[1].trim(), team,
            ppg:parseFloat(c[3])||0, bye:BYE[team]||0, ecr:i+1,
            espn:num(c[4]), cons:num(c[5]),
            rec:num(c[6]), recYd:num(c[7]), recTD:num(c[8]),
            rushYd:num(c[9]), rushTD:num(c[10]), fum:num(c[11]),
            passYd:num(c[12]), passTD:num(c[13]), intc:num(c[14]),
            gp:num(c[15]), note:(c[16]||"").trim()};
  });
}
/* Where the room is likely to take a player: real ADP first, board rank last. */
function marketRank(p){
  if(p.espn!=null && p.espn<170) return p.espn;
  if(p.cons!=null) return p.cons;
  return p.ecr + 60;
}

/* ============================================================
   SCORING → per-game value in THIS league
   ============================================================ */
function estRec(p){
  if(p.pos==="WR") return p.ppg/3.1;
  if(p.pos==="TE") return p.ppg/3.0;
  if(p.pos==="RB") return p.ppg/6.5;
  return 0;
}
/* The stat lines and the fallback projections come from different sources,
   and one runs consistently richer than the other. Without this the positions
   that lack stat lines would look better than they are — the app drafted four
   tight ends in testing. Measured from the players who appear in both. */
let CAL = 1;
function calibrate(list){
  const rs=[];
  list.forEach(p=>{
    if(p.rec!=null && p.ppg>0){
      const exact = (p.rushYd*0.1 + p.rushTD*6 + p.recYd*0.1 + p.recTD*6
                   + p.rec - (p.fum||0)*2) / GAMES;
      rs.push(exact/p.ppg);
    }
  });
  rs.sort((a,b)=>a-b);
  CAL = rs.length ? rs[Math.floor(rs.length/2)] : 1;
  return CAL;
}
calibrate(POOL);

function adjustedPPG(p, sc){
  // Quarterbacks: passing yards, touchdowns and picks straight from the
  // projection, so a 6-point passing TD league is computed, not approximated.
  if(p.passYd!=null){
    const pts = p.passYd/sc.passYdPerPt + p.passTD*sc.passTD - (p.intc||0)*2
              + (p.rushYd||0)*0.1 + (p.rushTD||0)*6;
    return Math.max(0, pts/GAMES);
  }
  // Exact where we have a stat line: compute this league's points from the
  // actual projected receptions, yards and touchdowns.
  if(p.rec!=null){
    let pts = p.rushYd*0.1 + p.rushTD*6 + p.recYd*0.1 + p.recTD*6
            + p.rec*sc.ppr - (p.fum||0)*2;
    if(p.pos==="TE") pts += p.rec*sc.tePremium;
    return Math.max(0, pts/GAMES);
  }
  // Otherwise fall back to converting the full-PPR projection, on the same scale.
  let v = p.ppg * CAL;
  if(p.pos==="QB"){
    const ptd = Math.max(0.6, v/12);
    v += (sc.passTD - 4) * ptd;
    const pyds = Math.max(150, 220 + (v-14)*8);
    v += pyds*(1/sc.passYdPerPt) - pyds*(1/25);
  } else {
    const rec = estRec(p);
    v += (sc.ppr - 1) * rec;
    if(p.pos==="TE") v += sc.tePremium * rec;
  }
  return Math.max(0, v);
}

/* replacement level = last starter-quality player at each position */
function replacementLevels(l){
  const r=l.roster, T=l.teams;
  const flexShare={RB:0.45,WR:0.45,TE:0.10};
  const superShare={QB:0.75,RB:0.08,WR:0.12,TE:0.05};
  const demand={};
  POSITIONS.forEach(pos=>{
    let d = (r[pos]||0)*T;
    if(FLEX_OK.includes(pos)) d += (r.FLEX||0)*T*flexShare[pos];
    if(SUPER_OK.includes(pos)) d += (r.SFLEX||0)*T*(superShare[pos]||0);
    demand[pos]=d;
  });
  const out={};
  POSITIONS.forEach(pos=>{
    const list = pool().filter(p=>p.pos===pos)
      .map(p=>adjustedPPG(p,l.scoring)).sort((a,b)=>b-a);
    if(!list.length){ out[pos]=0; return; }
    const idx = Math.min(list.length-1, Math.max(0, Math.round(demand[pos])));
    out[pos] = list[idx];
  });
  return out;
}

/* ============================================================
   DRAFT ORDER
   ============================================================ */
const totalPicks = l => l.teams * l.rounds;
function slotOfPick(l, overall){            // 1-indexed overall pick → slot number
  if(l.overrides[overall]) return l.overrides[overall];
  const r = Math.ceil(overall/l.teams);
  const i = overall - (r-1)*l.teams;
  if(l.type==="linear") return i;
  return (r%2===1) ? i : (l.teams - i + 1);
}
const currentPick = l => l.picks.length + 1;
// ownPicks, when set, is the explicit list of overall picks you hold —
// that's how a traded second first-rounder gets represented.
const isMine = (l,overall) => Array.isArray(l.ownPicks)
  ? l.ownPicks.includes(overall)
  : l.mySlots.includes(slotOfPick(l,overall));
function nextMyPick(l, from){
  for(let o=from; o<=totalPicks(l); o++) if(isMine(l,o)) return o;
  return null;
}
function teamName(l, slot){ return (l.managers[slot]||"").trim() || ("Team "+slot); }
const roundOf = (l,o) => Math.ceil(o/l.teams);

/* ============================================================
   SURVIVAL — chance a player is still there at my next pick
   Iterative rank-weighted model; tau = how by-the-book the room drafts.
   ============================================================ */
function survivalMap(l, avail, gap){
  const surv = new Map();
  avail.forEach(p=>surv.set(p.id,1));
  if(gap<=0) return surv;
  const tau = Math.max(1.5, l.tau);
  const n = Math.min(avail.length, 90);
  const base = [];
  for(let i=0;i<n;i++) base.push(Math.exp(-i/tau));
  const alive = new Array(n).fill(1);
  for(let k=0;k<gap;k++){
    let tot=0;
    for(let i=0;i<n;i++) tot += base[i]*alive[i];
    if(tot<=0) break;
    for(let i=0;i<n;i++){
      const pTaken = (base[i]*alive[i])/tot;
      alive[i] = Math.max(0, alive[i]-pTaken);
    }
  }
  for(let i=0;i<n;i++) surv.set(avail[i].id, Math.max(0,Math.min(1,alive[i])));
  return surv;
}

/* ============================================================
   MY ROSTER
   ============================================================ */
function myPlayers(l){
  const byId = new Map(pool().map(p=>[p.id,p]));
  return l.picks.filter(pk=>l.mySlots.includes(pk.slot))
                .map(pk=>byId.get(pk.playerId)).filter(Boolean);
}
function fillLineup(l, players){
  const r=l.roster, used=new Set(), slots=[];
  const take = (allowed)=>{
    let best=null;
    players.forEach(p=>{
      if(used.has(p.id) || !allowed.includes(p.pos)) return;
      if(!best || adjustedPPG(p,l.scoring) > adjustedPPG(best,l.scoring)) best=p;
    });
    if(best) used.add(best.id);
    return best;
  };
  POSITIONS.forEach(pos=>{
    for(let i=0;i<(r[pos]||0);i++) slots.push({label:pos, player:take([pos])});
  });
  for(let i=0;i<(r.FLEX||0);i++) slots.push({label:"FLEX", player:take(FLEX_OK)});
  for(let i=0;i<(r.SFLEX||0);i++) slots.push({label:"SFLEX", player:take(SUPER_OK)});
  const bench = players.filter(p=>!used.has(p.id));
  return {slots, bench};
}
function positionNeed(l, players, pos, myPicksLeft){
  const r=l.roster;
  const have = players.filter(p=>p.pos===pos).length;

  // kicker, defense and the IDP slot: worthless until the roster forces your hand
  if(pos==="K"||pos==="DST"||pos==="DP"){
    if(have >= (r[pos]||0)) return 0.02;
    const mustStillFill = ["K","DST","DP"].reduce((a,pp)=>
      a + Math.max(0,(r[pp]||0)-players.filter(p=>p.pos===pp).length), 0);
    return myPicksLeft <= mustStillFill ? 1.35 : 0.04;
  }
  if(pos==="QB"){
    const need = (r.QB||0) + (r.SFLEX||0);
    if(have < need) return 1;
    if(have >= need+1) return 0.04;          // never one more QB than you can start
    return (r.SFLEX>0) ? 0.45 : 0.16;
  }
  const primary = r[pos]||0;
  if(have < primary) return 1;
  // One backup tight end is plenty — they can't all start, and TE projections
  // come from the fallback source, so don't let them soak up flex demand.
  if(pos==="TE" && have >= primary+1) return 0.1;
  const flexCap = (r.FLEX||0)+(r.SFLEX||0);
  const flexers = FLEX_OK.reduce((a,pp)=>a+Math.max(0,players.filter(x=>x.pos===pp).length-(r[pp]||0)),0);
  if(flexers < flexCap) return 0.7;
  if(have < primary+2) return 0.32;
  return 0.16;                                // deep enough here already
}

/* ============================================================
   RECOMMENDATIONS
   ============================================================ */
function analyse(){
  const l = L();
  const repl = replacementLevels(l);
  const taken = new Set(l.picks.map(p=>p.playerId));
  const all = pool();
  const avail = all.filter(p=>!taken.has(p.id));

  const val = new Map();
  all.forEach(p=>{
    const a = adjustedPPG(p, l.scoring);
    // a player who'll miss time is worth his per-game rate times the games he plays
    const games = (p.gp!=null && p.gp<GAMES) ? p.gp : GAMES;
    val.set(p.id, {adj:a, vor:a*games - (repl[p.pos]||0)*GAMES});
  });

  // The room drafts mostly off a generic consensus list, but league rules bend it —
  // in a two-QB league nobody lets the QB1 slide to his overall rank. Blend the two.
  const adpOrder = avail.slice().sort((a,b)=>marketRank(a)-marketRank(b));
  const valOrder = avail.slice().sort((a,b)=>val.get(b.id).vor - val.get(a.id).vor);
  const adpIdx = new Map(adpOrder.map((p,i)=>[p.id,i]));
  const valIdx = new Map(valOrder.map((p,i)=>[p.id,i]));
  const marketOrder = avail.slice().sort((a,b)=>
    (0.62*adpIdx.get(a.id) + 0.38*valIdx.get(a.id)) -
    (0.62*adpIdx.get(b.id) + 0.38*valIdx.get(b.id)));

  const cur = currentPick(l);
  const mine = l.mySlots.length ? nextMyPick(l, cur) : null;
  const gap = mine ? (mine - cur) : 0;
  const surv = survivalMap(l, marketOrder, gap);      // will he last until my next pick?

  // Second horizon: if I pass on this position now, when do I get another shot?
  // On the clock that's my following pick; otherwise it's my next one.
  // With no slot set yet, assume a full round between turns so the board still advises.
  const after = mine ? (gap===0 ? nextMyPick(l, cur+1) : mine) : null;
  const gapAfter = after ? (after - cur) : (mine ? 0 : l.teams);
  const survAfter = gapAfter===gap ? surv : survivalMap(l, marketOrder, gapAfter);

  const roster = myPlayers(l);
  // With no slot set yet, assume a full draft ahead of you — otherwise the
  // "you're out of picks, take a kicker" rule fires and K/DST float to the top.
  let myPicksLeft = mine ? 0 : l.rounds;
  if(mine) for(let o=mine;o<=totalPicks(l);o++) if(isMine(l,o)) myPicksLeft++;
  const myByes = {};
  roster.forEach(p=>{ myByes[p.pos] = myByes[p.pos]||{}; myByes[p.pos][p.bye]=true; });

  // expected best VOR still on the board at my NEXT pick, per position
  const expBest = {};
  POSITIONS.forEach(pos=>{
    const list = avail.filter(p=>p.pos===pos)
      .sort((a,b)=>val.get(b.id).vor - val.get(a.id).vor).slice(0,25);
    let acc=0, gone=1;
    list.forEach(p=>{
      const s = survAfter.get(p.id) ?? 1;
      acc += val.get(p.id).vor * s * gone;
      gone *= (1-s);
    });
    expBest[pos]=acc;
  });

  // tier cliffs within each position
  const cliff = new Set();
  POSITIONS.forEach(pos=>{
    const list = avail.filter(p=>p.pos===pos)
      .sort((a,b)=>val.get(b.id).vor - val.get(a.id).vor);
    for(let i=0;i<Math.min(list.length-1,14);i++){
      const drop = val.get(list[i].id).vor - val.get(list[i+1].id).vor;
      if(drop > 14) cliff.add(list[i].id);
    }
  });

  const scored = avail.map(p=>{
    const v = val.get(p.id).vor;
    const need = positionNeed(l, roster, p.pos, myPicksLeft);
    const s = surv.get(p.id) ?? 1;
    // floor at a positive base first: multiplying a negative value by a low need
    // would otherwise make players you don't want look better, not worse
    const base = Math.max(0, v + 40);
    // what this pick actually buys you over the fallback at the same position
    const gain = v - (expBest[p.pos]||0);
    const gainBase = Math.max(0, gain + 40);
    const urgency = (1-(survAfter.get(p.id) ?? 1)) * Math.max(0, gain);
    const cliffBonus = cliff.has(p.id) ? 9 : 0;
    const byeHit = (myByes[p.pos] && myByes[p.pos][p.bye]) ? 6 : 0;
    const score = need*(base*0.45 + gainBase*0.55) + urgency*0.5 + cliffBonus*need - byeHit;
    return {p, vor:v, need, surv:s, gain, urgency, cliff:cliff.has(p.id), byeHit, score,
            adj:val.get(p.id).adj};
  }).sort((a,b)=>b.score-a.score);

  return {l, avail, scored, val, surv, cur, mine, gap, roster, repl, expBest, cliff, myPicksLeft};
}

/* auction dollar value */
function auctionValues(A){
  const l=A.l;
  const spots = l.teams * (Object.keys(l.roster).reduce((a,k)=>a+(l.roster[k]||0),0));
  const money = l.teams*l.budget - spots;
  const pos = A.scored.slice().sort((a,b)=>b.vor-a.vor).slice(0, spots);
  const totVor = pos.reduce((a,x)=>a+Math.max(0,x.vor),0) || 1;
  const m = new Map();
  pos.forEach(x=> m.set(x.p.id, Math.max(1, Math.round(1 + (Math.max(0,x.vor)/totVor)*money))));
  return m;
}

function renderRibbon(A){
  const l=A.l, cur=A.cur, host=el("ribbon");
  if(!l.mySlots.length){
    host.innerHTML = `<div class="clock"><div class="clocknum">–</div>
      <div class="clocklab"><div class="l1">Set your draft slot in Settings to start</div></div></div>`;
    return;
  }
  const done = cur > totalPicks(l);
  let big, lab;
  if(done){ big="✓"; lab="Draft complete"; }
  else if(A.gap===0){ big="NOW"; lab="You're on the clock"; }
  else { big=A.gap; lab= A.gap===1 ? "pick until you're up" : "picks until you're up"; }

  const start = Math.max(1, cur-1);
  const end = Math.min(totalPicks(l), start+23);
  let flow="";
  for(let o=start;o<=end;o++){
    const slot=slotOfPick(l,o), me=l.mySlots.includes(slot);
    const pk=l.picks[o-1];
    flow += `<div class="fp ${me?"mine":""} ${pk?"done":""} ${o===cur?"oc":""}">
      <div class="n">${roundOf(l,o)}.${String(o-(roundOf(l,o)-1)*l.teams).padStart(2,"0")}</div>
      <div class="t">${esc(pk ? pk.name.split(" ").slice(-1)[0] : teamName(l,slot))}</div></div>`;
  }
  host.innerHTML =
    `<div class="clock">
       <div class="clocknum ${A.gap===0&&!done?"now":""} disp">${big}</div>
       <div class="clocklab"><div class="l1">${lab}</div></div>
     </div>
     <div class="flow">${flow}</div>`;
}

  el("posChips").innerHTML = ["ALL",...POSITIONS].map(p=>
    `<button class="chip ${filterPos===p?"on":""}" data-p="${p}">${p}</button>`).join("");
  el("posChips").querySelectorAll("button").forEach(b=>
    b.onclick=()=>{ filterPos=b.dataset.p; renderAll(); });

  const taken = new Map(l.picks.map(p=>[p.playerId,p]));
  const auction = l.type==="auction" ? auctionValues(A) : null;
  const q = query.trim().toLowerCase();
  let list = A.scored;
  if(showDrafted){
    const byId=new Map(pool().map(p=>[p.id,p]));
    const extra = l.picks.map(pk=>({p:byId.get(pk.playerId), vor:0, surv:0, drafted:pk}))
                         .filter(x=>x.p);
    list = A.scored.concat(extra);
  }
  const rows = list.filter(x=>{
    if(filterPos!=="ALL" && x.p.pos!==filterPos) return false;
    if(q && !(x.p.name.toLowerCase().includes(q) || x.p.team.toLowerCase().includes(q))) return false;
    return true;
  }).slice(0,220);

  el("boardSub").textContent =
    `${A.avail.length} available · left column is ADP · scored for ${l.scoring.ppr===1?"full PPR":l.scoring.ppr===0.5?"half PPR":"standard"}`;

  el("rows").innerHTML = rows.map(x=>{
    const p=x.p, d=taken.get(p.id);
    const val = auction ? ("$"+(auction.get(p.id)||1)) : (x.vor>0? "+"+x.vor.toFixed(0) : x.vor.toFixed(0));
    return `<div class="row p-${p.pos} ${x.cliff?"cliff":""}" ${d?'style="opacity:.42"':""}>
      <div class="rk">${p.espn!=null&&p.espn<170?p.espn.toFixed(0):"–"}</div>
      <div>
        <div class="nm" data-info="${p.id}">${esc(p.name)}</div>
        <div class="meta"><span class="pos ${p.pos}">${p.pos}</span> ${esc(p.team)}
          <span>bye ${p.bye||"–"}</span>
          ${x.cliff?'<span class="tag hot">tier ends</span>':""}
          ${p.note?`<span class="tag hurt">${esc(p.note)}</span>`:""}
          ${d?`<span class="tag">${esc(teamName(l,d.slot))}</span>`:
              `<button class="assign" data-assign="${p.id}">assign…</button>`}
        </div>
      </div>
      <div class="num">${x.adj?x.adj.toFixed(1):""}</div>
      <div class="num">${d?"":val}</div>
      <div class="surv">${d?"":`<span class="dot" style="background:${dotColor(x.surv)}"></span>${Math.round(x.surv*100)}%`}</div>
      <div>${d?"":`<button class="take" data-take="${p.id}" title="Log this pick">→</button>`}</div>
    </div>`;
  }).join("") || `<div style="padding:22px;text-align:center;color:var(--muted)">No players match that search.</div>`;

  el("rows").querySelectorAll("[data-take]").forEach(b=>
    b.onclick=()=>draftPlayer(+b.dataset.take,null));
  el("rows").querySelectorAll("[data-assign]").forEach(b=>
    b.onclick=()=>assignDialog(+b.dataset.assign));
  el("rows").querySelectorAll("[data-info]").forEach(b=>
    b.onclick=()=>infoDialog(+b.dataset.info, A));
}

function renderRecs(A){
  const l=A.l;
  const head = el("recHead");
  if(!l.mySlots.length){ head.textContent="Best available"; }
  else if(A.gap===0){ head.innerHTML=`Take one of these <span class="sub">you're on the clock</span>`; }
  else { head.innerHTML=`Plan for pick ${A.mine||"–"} <span class="sub">${A.gap} away</span>`; }

  const auction = l.type==="auction" ? auctionValues(A) : null;
  const top = A.scored.filter(x=>x.need>0.05).slice(0,5);
  const maxScore = top.length? top[0].score : 1;

  el("recs").innerHTML = top.map((x,i)=>{
    const bits=[];
    if(x.cliff) bits.push(`last of the ${x.p.pos} tier`);
    if(A.gap>0) bits.push(`${Math.round(x.surv*100)}% to last until your pick`);
    if(x.urgency>6) bits.push(`+${x.urgency.toFixed(0)} pts over what you'd get by waiting`);
    if(x.need>=1) bits.push(`fills a starting ${x.p.pos} spot`);
    else if(x.need<0.4) bits.push(`bench depth — you're set at ${x.p.pos}`);
    if(x.byeHit) bits.push(`shares a bye with your other ${x.p.pos}`);
    if(x.p.note) bits.push(x.p.note);
    if(auction) bits.push(`worth about $${auction.get(x.p.id)||1}`);
    return `<div class="rec p-${x.p.pos} ${i===0?"top":""}">
      <div class="rechead"><span class="recrank">${i+1}</span>
        <span class="recname">${esc(x.p.name)}</span>
        <span class="pos ${x.p.pos}">${x.p.pos}</span>
        <span class="meta">${esc(x.p.team)} · bye ${x.p.bye||"–"}</span></div>
      <div class="recwhy">${bits.join(" · ")}</div>
      <div class="bars"><i style="width:${Math.max(6,Math.round(100*x.score/maxScore))}%"></i></div>
      <button class="recbtn" data-take="${x.p.id}">${A.gap===0?"Draft him":"Log pick"}</button>
    </div>`;
  }).join("") || `<div style="padding:20px;color:var(--muted)">Board's empty — the draft is done.</div>`;

  el("recs").querySelectorAll("[data-take]").forEach(b=>
    b.onclick=()=>draftPlayer(+b.dataset.take,null));
}

function renderRoster(A){
  const l=A.l, {slots,bench} = fillLineup(l, A.roster);
  const byeCount={};
  A.roster.forEach(p=>{ if(p.bye) byeCount[p.bye]=(byeCount[p.bye]||0)+1; });
  const clash = Object.entries(byeCount).filter(([w,c])=>c>=3).map(([w,c])=>`wk ${w}: ${c}`);
  el("rosterSub").textContent = `${A.roster.length} picked`;
  el("roster").innerHTML =
    slots.map(s=>`<div class="slotline">
        <span class="sl">${s.label}</span>
        <span class="${s.player?"":"empty"}">${s.player?esc(s.player.name):"open"}</span>
        <span class="meta">${s.player?`${s.player.team} · ${s.player.bye}`:""}</span>
      </div>`).join("") +
    (bench.length? `<div class="slotline"><span class="sl">Bench</span>
        <span>${bench.map(p=>esc(p.name)).join(", ")}</span><span></span></div>`:"") +
    (clash.length? `<div class="slotline"><span class="sl">Byes</span>
        <span class="byewarn">${clash.join(" · ")} — stacked</span><span></span></div>`:"");
}

function renderRuns(A){
  const l=A.l, recent=l.picks.slice(-12);
  const c={};
  recent.forEach(p=>{ c[p.pos]=(c[p.pos]||0)+1; });
  const max = Math.max(1,...Object.values(c));
  el("runs").innerHTML = POSITIONS.map(pos=>{
    const n=c[pos]||0;
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <span class="pos ${pos}" style="width:34px;text-align:center">${pos}</span>
      <div class="bars" style="flex:1;margin:0"><i style="width:${Math.round(100*n/max)}%;background:var(--${pos.toLowerCase()})"></i></div>
      <span class="mono" style="font-size:11.5px;width:14px;text-align:right">${n}</span></div>`;
  }).join("") + (recent.length<3?`<div class="hint">Fills in as picks are logged.</div>`:"");
}

function renderRoom(A){
  const l=A.l, byId=new Map(pool().map(p=>[p.id,p]));
  const rows=[];
  for(let s=1;s<=l.teams;s++){
    if(l.mySlots.includes(s)) continue;
    const players = l.picks.filter(pk=>pk.slot===s).map(pk=>byId.get(pk.playerId)).filter(Boolean);
    let next=null, left=0;
    for(let o=A.cur;o<=totalPicks(l);o++){
      if(slotOfPick(l,o)===s && !isMine(l,o)){ if(next===null) next=o; left++; }
    }
    if(next===null) continue;
    rows.push({s,next,players,left,targets:[]});
  }
  rows.sort((a,b)=>a.next-b.next);

  // Walk the room in pick order. Once a team is likely to take someone, he's
  // off the table for everyone behind them — otherwise every row lists the same back.
  const claimed = new Set();
  rows.forEach(r=>{
    r.targets = A.avail.filter(p=>!claimed.has(p.id)).map(p=>{
      const v = A.val.get(p.id).vor;
      const need = positionNeed(l, r.players, p.pos, r.left);
      return {p, need, v, score: Math.max(0,v+40)*need + (A.cliff.has(p.id)?9:0)*need};
    }).filter(t=>t.need>0.05).sort((a,b)=>b.score-a.score).slice(0,3);
    if(r.targets.length) claimed.add(r.targets[0].p.id);
  });

  el("roomSub").textContent = A.mine
    ? "highlighted teams pick before you do"
    : "who each team is likely eyeing, from their roster holes and the board";

  el("roomBody").innerHTML = rows.map(r=>{
    const shape = POSITIONS.map(pos=>{
      const n=r.players.filter(p=>p.pos===pos).length;
      return n? `<span style="background:var(--${pos.toLowerCase()})">${n}${pos}</span>` : null;
    }).filter(Boolean).join("") || `<span style="background:var(--line);color:var(--muted)">nothing yet</span>`;
    const tg = r.targets.map(t=>{
      const why = t.need>=1 ? `needs a starting ${t.p.pos}`
                : A.cliff.has(t.p.id) ? `${t.p.pos} tier ends here`
                : t.need>=0.7 ? `flex value` : `best left on their board`;
      return `<div class="tgt"><span class="pos ${t.p.pos}">${t.p.pos}</span>
        <span><b>${esc(t.p.name)}</b> <span class="r">— ${why}</span></span></div>`;
    }).join("") || `<span class="meta">board's picked over</span>`;
    return `<tr class="${(A.mine && r.next<A.mine)?"soon":""}">
      <td class="who">${esc(teamName(l,r.s))}</td>
      <td class="pk">${roundOf(l,r.next)}.${String(r.next-(roundOf(l,r.next)-1)*l.teams).padStart(2,"0")}
        <br><span style="font-size:10.5px">${r.next-A.cur} away</span></td>
      <td class="hidesm"><div class="shape">${shape}</div></td>
      <td>${tg}</td></tr>`;
  }).join("") || `<tr><td colspan="4" style="padding:16px;color:var(--muted)">Tick your draft slot in Settings and the rest of the room shows up here.</td></tr>`;
}

function renderLog(A){
  const l=A.l;
  el("logSub").textContent = `${l.picks.length} of ${totalPicks(l)}`;
  el("log").innerHTML = l.picks.slice().reverse().map(pk=>
    `<div class="logrow">
      <span class="p">${roundOf(l,pk.overall)}.${String(pk.overall-(roundOf(l,pk.overall)-1)*l.teams).padStart(2,"0")}</span>
      <span>${esc(pk.name)} <span class="pos ${pk.pos}">${pk.pos}</span></span>
      <span class="meta">${esc(teamName(l,pk.slot))}${pk.price?` · $${pk.price}`:""}</span>
    </div>`).join("") || `<div style="padding:14px;color:var(--muted)">No picks logged yet. Tap → next to a player as each name comes off the board.</div>`;
}

function renderFooter(){
  el("footer").innerHTML =
    `The ADP column is real market data — a nine-platform consensus including ESPN, pulled 2 Sep 2026, draft-day fresh — and it drives the survival odds. ` +
    `Running backs and receivers are scored from projected receptions, yards and touchdowns, so your scoring settings are applied exactly rather than estimated. ` +
    `Quarterbacks and tight ends are computed from passing and receiving projections too, so a 6-point passing TD is applied exactly. ` +
    `Only kickers, defenses and a handful of backups fall back to a converted per-game number. Byes from the 2026 NFL schedule. ` +
    `Everything saves to this browser automatically — reload freely, but use Data → Export before switching devices.`;
}

function renderAll(){
  renderTabs();
  const A = analyse();
  el("setupView").classList.toggle("hidden", !setupOpen);
  el("draftView").classList.toggle("hidden", setupOpen);
  renderRibbon(A);
  if(setupOpen){ renderSetup(); }
  else { renderBoard(A); renderRecs(A); renderRoster(A); renderRuns(A); renderRoom(A); renderLog(A); }
  el("roomCard").classList.toggle("hidden", setupOpen);
  renderFooter();
  save();
}

/* ============================================================
   ACTIONS
   ============================================================ */
function draftPlayer(pid, slotOverride){
  const l=L(), o=currentPick(l);
  if(o>totalPicks(l)){ return toast("Every pick is logged. Add rounds in Settings if the draft ran long."); }
  const p = pool().find(x=>x.id===pid);
  if(!p) return;
  if(l.picks.some(x=>x.playerId===pid)) return toast(p.name+" is already off the board.");
  const natural = slotOfPick(l,o);
  // a pick you traded for still belongs to your roster, not its original owner
  const slot = slotOverride ||
    ((isMine(l,o) && !l.mySlots.includes(natural)) ? (l.mySlots[0] || natural) : natural);
  let price=null;
  if(l.type==="auction"){
    const v = prompt(`Winning bid for ${p.name}?`, "1");
    if(v===null) return;
    price = Math.max(0, parseInt(v,10)||0);
  }
  l.picks.push({overall:o, slot, playerId:pid, name:p.name, pos:p.pos, price});
  save(); renderAll();
}
function assignDialog(pid){
  const l=L(), p=pool().find(x=>x.id===pid);
  const opts = Array.from({length:l.teams},(_,i)=>i+1)
    .map(s=>`<option value="${s}">${esc(teamName(l,s))}</option>`).join("");
  openDialog(`<h4>Assign ${esc(p.name)}</h4>
    <p style="margin:0 0 10px;color:var(--muted);font-size:12.5px">Use this when you fall behind and picks land out of order.</p>
    <select id="asel" style="width:100%">${opts}</select>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn" id="ago">Log pick</button></div>`);
  el("ago").onclick=()=>{ const s=+el("asel").value; el("dlg").close(); draftPlayer(pid,s); };
}
function infoDialog(pid, A){
  const p=pool().find(x=>x.id===pid);
  const x=A.scored.find(y=>y.p.id===pid);
  const l=A.l;
  const same = A.avail.filter(y=>y.pos===p.pos)
    .sort((a,b)=>a.ecr-b.ecr).slice(0,6)
    .map(y=>`<li>${esc(y.name)} <span class="mono" style="color:var(--muted)">#${y.ecr}</span></li>`).join("");
  openDialog(`<h4>${esc(p.name)} · ${p.pos} ${esc(p.team)}</h4>
    <div class="grid2" style="margin-bottom:10px">
      <div><label class="f">Overall rank</label><b class="mono">${p.ecr}</b></div>
      <div><label class="f">Proj / game here</label><b class="mono">${x?x.adj.toFixed(1):adjustedPPG(p,l.scoring).toFixed(1)}</b></div>
      <div><label class="f">Over replacement</label><b class="mono">${x?(x.vor>0?"+":"")+x.vor.toFixed(0):"–"}</b></div>
      <div><label class="f">Bye</label><b class="mono">Week ${p.bye||"–"}</b></div>
    </div>
    <label class="f">Next ${p.pos}s on the board</label><ul style="margin:4px 0 0;padding-left:18px">${same}</ul>
    <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn ghost" data-close>Close</button></div>`);
}
function undo(){
  const l=L();
  if(!l.picks.length) return toast("Nothing to undo.");
  const last=l.picks.pop();
  save(); renderAll(); toast(`Put ${last.name} back on the board.`);
}
function toast(msg){
  let t=el("toast");
  if(!t){ t=document.createElement("div"); t.id="toast";
    t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.18)";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity="0",2200);
}
function openDialog(html){
  el("dlgBody").innerHTML=html;
  el("dlg").showModal();
  el("dlgBody").querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>el("dlg").close());
}

function renderSetup(){
  const l=L();
  el("setupName").textContent = l.name;
  const r=l.roster, sc=l.scoring;
  const slotCards = Array.from({length:l.teams},(_,i)=>{
    const s=i+1, mine=l.mySlots.includes(s);
    return `<div class="slotpick ${mine?"mine":""}">
      <span class="n">${s}</span>

      <div class="f"><label class="f">Format</label><select data-k="type">
        <option value="snake"${l.type==="snake"?" selected":""}>Snake</option>
        <option value="linear"${l.type==="linear"?" selected":""}>Linear</option>
        <option value="auction"${l.type==="auction"?" selected":""}>Auction</option></select></div>
      ${l.type==="auction"?`<div class="f"><label class="f">Budget per team</label><input type="number" data-k="budget" value="${l.budget}"></div>`:""}
      <div class="f"><label class="f">Room drafts by the rankings</label>
        <select data-k="tau">
          <option value="3"${l.tau==3?" selected":""}>Very chalky</option>
          <option value="5"${l.tau==5?" selected":""}>Normal</option>
          <option value="8"${l.tau==8?" selected":""}>Unpredictable</option>
        </select></div>
    </div>
  </fieldset>

  <fieldset><legend>Scoring</legend>
    <div class="grid2">
      <div class="f"><label class="f">Points per reception</label><select data-s="ppr">
        <option value="1"${sc.ppr==1?" selected":""}>Full PPR (1.0)</option>
        <option value="0.5"${sc.ppr==0.5?" selected":""}>Half PPR (0.5)</option>
        <option value="0"${sc.ppr==0?" selected":""}>Standard (0)</option></select></div>
      <div class="f"><label class="f">TE premium (extra per catch)</label><input type="number" step="0.25" data-s="tePremium" value="${sc.tePremium}"></div>
      <div class="f"><label class="f">Passing TD</label><select data-s="passTD">
        <option value="4"${sc.passTD==4?" selected":""}>4 points</option>
        <option value="6"${sc.passTD==6?" selected":""}>6 points</option></select></div>
      <div class="f"><label class="f">Yards per passing point</label><select data-s="passYdPerPt">
        <option value="25"${sc.passYdPerPt==25?" selected":""}>25 (standard)</option>
        <option value="20"${sc.passYdPerPt==20?" selected":""}>20</option></select></div>
    </div>

    b.onclick=()=>{
      const o=+b.dataset.pick;
      if(!Array.isArray(l.ownPicks)){          // freeze the current slot into an explicit list
        const seed=[];                          // build it BEFORE assigning, or isMine reads the empty list
        for(let k=1;k<=totalPicks(l);k++) if(isMine(l,k)) seed.push(k);
        l.ownPicks=seed;
      }
      const i=l.ownPicks.indexOf(o);
      if(i>=0) l.ownPicks.splice(i,1); else l.ownPicks.push(o);
      l.ownPicks.sort((a,b)=>a-b);
      if(!l.mySlots.length && l.ownPicks.length) l.mySlots=[slotOfPick(l,l.ownPicks[0])];
      save(); renderAll();
    };
  });
  el("resetOwn").onclick=()=>{ l.ownPicks=null; save(); renderAll(); toast("Back to your normal slot."); };

  el("doneSetup").onclick=()=>{ setupOpen=false; renderAll(); };
  const lp = el("loadPreset");
  if(lp) lp.onclick=()=>{
    if(!confirm("Reload the saved settings for "+PRESETS[S.active].name+"? Logged picks and your draft slot stay as they are.")) return;
    const fresh = applyPreset(S.active);
    const keep = {mySlots:l.mySlots, picks:l.picks, overrides:l.overrides, customPool:l.customPool};
    S.leagues[S.active] = Object.assign(fresh, keep);
    save(); renderAll(); toast("Settings reloaded.");
  };
  el("resetPicks").onclick=()=>{
    if(confirm("Clear every logged pick in "+l.name+"? Settings stay.")){ l.picks=[]; save(); renderAll(); }
  };
}

/* ============================================================
   DATA: export / import / custom rankings
   ============================================================ */
function dataDialog(){
  const l=L();
  openDialog(`<h4>Data</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="iconbtn" id="dExp">Export all three leagues</button>
      <button class="iconbtn" id="dImp">Import a saved file</button>
    </div>
    <label class="f">Refresh the rankings for ${esc(l.name)}</label>
    <p style="margin:2px 0 6px;color:var(--muted);font-size:12px">
      One player per line, best first:<br>
      <span class="mono">Name|POS|TEAM|ppg|espnADP|consADP|rec|recYds|recTD|rushYds|rushTD|fum|passYds|passTD|int</span><br>
      Only the first four are required — leave the rest empty and that player falls back to a converted
      per-game number. Paste a fresh board the morning of the draft and everything recalculates.</p>
    <textarea id="dPool" placeholder="Ja'Marr Chase|WR|CIN|23.5"></textarea>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
      <button class="iconbtn" id="dReset">Back to the built-in board</button>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" data-close>Close</button>
        <button class="btn" id="dSave">Use these rankings</button>
      </div>
    </div>
    <input type="file" id="dFile" accept="application/json" class="hidden">`);

  el("dExp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="draft-room-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  el("dImp").onclick=()=>el("dFile").click();
  el("dFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const p=JSON.parse(rd.result);
        if(!p.leagues || p.leagues.length!==3) throw new Error("bad shape");
        S=p; save(); el("dlg").close(); renderAll(); toast("Loaded that file.");
      }catch(err){ toast("That file isn't a Draft Room export."); }
    };
    rd.readAsText(f);
  };
  el("dSave").onclick=()=>{
    const txt=el("dPool").value.trim();
    if(!txt) return toast("Paste some rankings first.");
    try{
      const parsed=parsePool(txt);
      if(parsed.length<20) throw new Error("too short");
      if(parsed.some(p=>!p.name || !POSITIONS.includes(p.pos))) throw new Error("bad rows");
      l.customPool=parsed; l.picks=[]; save(); el("dlg").close(); renderAll();
      toast(`Loaded ${parsed.length} players. Picks were cleared to keep IDs in sync.`);
    }catch(err){ toast("Couldn't read that — check the Name|POS|TEAM|PPG format."); }
  };
  el("dReset").onclick=()=>{
    l.customPool=null; l.picks=[]; save(); el("dlg").close(); renderAll();
    toast("Back on the built-in board.");
  };
}

/* ============================================================
   WIRE UP
   ============================================================ */
el("btnSetup").onclick=()=>{ setupOpen=!setupOpen; renderAll(); };
el("btnUndo").onclick=undo;
el("btnData").onclick=dataDialog;
el("search").oninput=e=>{ query=e.target.value; renderAll(); };
el("showDrafted").onchange=e=>{ showDrafted=e.target.checked; renderAll(); };
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
  if(e.key==="/"){ e.preventDefault(); el("search").focus(); }
  if((e.key==="z"||e.key==="Z") && (e.metaKey||e.ctrlKey)){ e.preventDefault(); undo(); }
});

if(!L().mySlots.length && !L().picks.length) setupOpen = true;
renderAll();
</script>
</body>
